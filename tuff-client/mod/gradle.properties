# Gradle options; per-version settings are in stonecutter.properties.toml
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric's maven is sometimes slow from CI runners: wait longer and retry downloads
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.repo.max.retries=6
systemProp.org.gradle.internal.repo.initial.backoff=1000
