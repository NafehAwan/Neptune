plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'tuff-client'
}

// One version for all of Glade: the launcher's, so each release carries a
// matching launcher and mod (the launcher's updater compares these).
version = new groovy.json.JsonSlurper().parse(file('../launcher/src-tauri/tauri.conf.json')).version

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Client game tests: boot the real game, open every Tuff screen and save
// screenshots (run/screenshots) so CI checks the mod at runtime.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "tuff-test"
		enableGameTests = false
		eula = true
	}
}
