<!doctype html>
<html><head><meta charset="utf-8"><title>Glade Teaser</title>
<style>
@font-face { font-family: Fraunces; src: url(fraunces.woff2); font-style: italic; font-weight: 600; }
@font-face { font-family: Jakarta; src: url(jakarta500.woff2); font-weight: 500; }
@font-face { font-family: Jakarta; src: url(jakarta800.woff2); font-weight: 800; }
html, body { margin: 0; background: #F6F4EE; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Glade teaser in the client's own Grove Glass look, 13 s, cut to "COOOK PARDON".
// Before the drop the grove is grey and cluttered; at 5.0 s the colour blooms
// back. After the drop every cut is on a kick (BEAT apart). draw(t) renders t.
const c = document.getElementById("c"), x = c.getContext("2d"), W = 1920, H = 1080;
const DROP = 5.0, BEAT = 0.4646, END = DROP + 12 * BEAT;
const img = s => { const i = new Image(); i.src = s; return i; };
const leaf = img("leaf.svg");
const SHOTS = Object.fromEntries(["title", "freelook-cape-sky", "hud-style", "color-picker", "launcher-crash", "launcher-update"].map(n => [n, img(`shots/${n}.jpg`)]));
const ready = Promise.all([document.fonts.load("600 italic 100px Fraunces"), document.fonts.load("500 40px Jakarta"), document.fonts.load("800 40px Jakarta"),
  ...[leaf, ...Object.values(SHOTS)].map(i => new Promise(r => (i.complete ? r() : (i.onload = r))))]);

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outC = p => 1 - Math.pow(1 - p, 3), outQ = p => 1 - Math.pow(1 - p, 5), inOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = p => { const k = 2.0; return 1 + (k + 1) * Math.pow(p - 1, 3) + k * Math.pow(p - 1, 2); };
const rgba = (h, a = 1) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const GREEN = "#2F6B4F", MINT = "#7FD1A4", PAPER = "#F6F4EE", INK = "#1F2A22", MUTED = "#5B675E", RED = "#D9483B";

function txt(s, px, py, font, color, a = 1, align = "center", spacing = 0) {
  if (a <= 0) return;
  x.save(); x.globalAlpha *= a; x.font = font; x.fillStyle = color; x.textAlign = align; x.textBaseline = "middle";
  x.letterSpacing = spacing + "px"; x.fillText(s, px, py); x.restore();
}
function rr(px, py, w, h, r) { x.beginPath(); x.roundRect(px, py, w, h, r); }
function glass(px, py, w, h, r, a = 1) {
  x.save(); x.globalAlpha *= a;
  x.shadowColor = rgba("#1E3C28", 0.2); x.shadowBlur = 60; x.shadowOffsetY = 20;
  rr(px, py, w, h, r); x.fillStyle = rgba("#FFFFFF", 0.62); x.fill();
  x.shadowColor = "transparent"; x.lineWidth = 2; x.strokeStyle = rgba("#FFFFFF", 0.95); x.stroke();
  x.restore();
}
function logo(cx, cy, size, a = 1, rot = 0) {
  if (size <= 0) return;
  x.save(); x.globalAlpha *= a; x.translate(cx, cy); x.rotate(rot); x.drawImage(leaf, -size / 2, -size / 2, size, size); x.restore();
}

// ------------------------------------------------- the grove (sat 0 = grey)
function grove(t, sat) {
  x.save(); x.filter = `saturate(${sat.toFixed(3)})`;
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#CFE6D9"); g.addColorStop(1, PAPER);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.save(); x.translate(W * 0.5, H * 0.36); x.rotate(t * 0.07);
  for (let i = 0; i < 12; i++) { x.rotate(Math.PI / 6); x.fillStyle = rgba("#FFFFFF", 0.24 * sat); x.beginPath(); x.moveTo(0, 0); x.lineTo(1500, -90); x.lineTo(1500, 90); x.fill(); }
  x.restore();
  const sun = x.createRadialGradient(W / 2, H * 0.36, 0, W / 2, H * 0.36, 640);
  sun.addColorStop(0, rgba("#FFF2CC", 0.9 * sat)); sun.addColorStop(1, rgba("#FFF2CC", 0)); x.fillStyle = sun; x.fillRect(0, 0, W, H);
  for (let layer = 0; layer < 3; layer++) {
    const base = H - 120 + layer * 55, shift = (t * (16 + layer * 22)) % 160;
    x.fillStyle = ["#A9CDB5", "#83B394", "#5E9874"][layer]; x.beginPath(); x.moveTo(0, H);
    for (let px = -160; px <= W + 160; px += 40) x.lineTo(px - shift, base - Math.sin((px + layer * 300) / 260) * 34);
    x.lineTo(W, H); x.fill();
    for (let px = -160; px <= W + 160; px += 160 - layer * 30) {
      const tx = px - shift + layer * 50, ty = base - Math.sin((px + layer * 300 + 30) / 260) * 34;
      x.fillRect(tx - 5, ty - 30, 10, 30); x.fillRect(tx - 24, ty - 70 - layer * 6, 48, 44 + layer * 6);
    }
  }
  for (let i = 0; i < 50; i++) {
    const px = (hash(i) * W + t * (50 + hash(i + 3) * 120)) % W, py = (hash(i + 5) * H + t * 40 + Math.sin(t * 2 + i) * 18) % H, s = 6 + hash(i + 9) * 12;
    x.save(); x.translate(px, py); x.rotate(t * 1.4 + i); x.fillStyle = rgba(hash(i + 1) > 0.5 ? "#4E8C66" : "#8DBF9C", 0.5 + hash(i + 11) * 0.45); x.fillRect(-s / 2, -s / 4, s, s / 2); x.restore();
  }
  x.restore();
}

// ------------------------------------------------- 0 – 3.45 s: clients today
const POPUPS = [
  [0.25, 200, 150, 540, 150, "Unlock capes", "Only $9.99 / month", "#E0A030"],
  [0.55, 1190, 110, 520, 150, "Version not supported", "Please use 1.8.9", RED],
  [0.85, 150, 700, 520, 150, "Loading assets…", "87% · 412 MB", "#8C928F"],
  [1.05, 1260, 690, 520, 150, "Premium only", "This module needs Plus", "#E0A030"],
  [1.3, 700, 420, 520, 150, "The game crashed", "exit code -1", RED],
  [1.55, 380, 430, 440, 130, "Update required", "Restart to continue", "#8C928F"],
];
function problem(t) {
  if (t > 3.5) return;
  grove(t, 0);
  x.fillStyle = rgba("#E8E8E4", 0.45); x.fillRect(0, 0, W, H);
  const shake = seg(t, 1.7, 3.4) * 12, fr = Math.floor(t * 40);
  x.save(); x.translate((hash(fr) - 0.5) * shake, (hash(fr + 9) - 0.5) * shake);
  for (const [at, px, py, w, h, title, sub, col] of POPUPS) {
    const p = back(seg(t, at, at + 0.22)); if (p <= 0) continue;
    x.save(); x.translate(px + w / 2, py + h / 2); x.scale(p, p); x.rotate((hash(at) - 0.5) * 0.08);
    x.shadowColor = "rgba(0,0,0,0.18)"; x.shadowBlur = 30; x.shadowOffsetY = 10;
    rr(-w / 2, -h / 2, w, h, 14); x.fillStyle = "#FBFBFA"; x.fill(); x.shadowColor = "transparent";
    x.strokeStyle = "#D5D6D2"; x.lineWidth = 2; x.stroke();
    x.fillStyle = col; x.fillRect(-w / 2, -h / 2 + 18, 6, h - 36);
    txt(title, -w / 2 + 34, -18, "800 34px Jakarta", "#2B2E2C", 1, "left");
    txt(sub, -w / 2 + 34, 26, "500 26px Jakarta", "#8C928F", 1, "left");
    txt("×", w / 2 - 34, -h / 2 + 30, "500 34px Jakarta", "#A0A49F");
    x.restore();
  }
  const fps = Math.round(144 - seg(t, 0.4, 3.2) * 131);
  txt(`FPS ${fps}`, W - 60, 56, "800 42px Jakarta", fps < 40 ? RED : "#4A4F4C", 1, "right", 2);
  x.restore();
  x.fillStyle = rgba(PAPER, 0.55); x.fillRect(0, 0, W, H);
  const q = outQ(seg(t, 0.1, 0.45));
  if (t < 1.72) {
    txt("Minecraft clients", W / 2, 470 + (1 - q) * 50, "600 italic 150px Fraunces", INK, q);
    txt("TODAY?", W / 2, 610, "800 70px Jakarta", RED, seg(t, 0.8, 1.0), "center", 16);
  }
  const words = [[1.72, "BLOATED."], [2.24, "LAGGY."], [2.76, "PAYWALLED."]];
  words.forEach(([at, w], i) => {
    const next = words[i + 1] ? words[i + 1][0] : 3.36;
    if (t < at || t >= next) return;
    const p = seg(t, at, at + 0.12), s = 1.25 - outC(p) * 0.25, split = 9 * (1 - p) + 2;
    x.save(); x.translate(W / 2, H / 2); x.scale(s, s);
    txt(w, -split, 0, "800 230px Jakarta", rgba(RED, 0.55)); txt(w, split, 0, "800 230px Jakarta", rgba("#3A7BD5", 0.45));
    txt(w, 0, 0, "800 230px Jakarta", INK);
    x.fillStyle = RED; x.fillRect(-580, -6, 1160 * outC(seg(t, at + 0.16, at + 0.3)), 16);
    x.restore();
  });
  if (t > 1.7) for (let i = 0; i < 6; i++) {
    const h = hash(Math.floor(t * 24) * 13 + i);
    if (h > 0.6) { const y0 = hash(h * 99) * H; x.drawImage(c, 0, y0, W, 22, (h - 0.8) * 110, y0, W, 22); }
  }
  const cut = seg(t, 3.36, 3.46);
  if (cut > 0) { x.fillStyle = PAPER; x.fillRect(0, 0, W, H * cut / 2); x.fillRect(0, H - H * cut / 2, W, H * cut / 2); }
}

// --------------------------------------- 3.45 – 5.0 s: so we built our own
function builtOwn(t) {
  if (t < 3.45 || t > DROP) return;
  grove(t, seg(t, 3.6, DROP) * 0.6);
  x.fillStyle = rgba(PAPER, 0.78 - seg(t, 4.2, DROP) * 0.4); x.fillRect(0, 0, W, H);
  const line = "So we built our own.", n = Math.floor(seg(t, 3.5, 4.25) * line.length);
  x.font = "600 italic 130px Fraunces"; const full = x.measureText(line).width;
  txt(line.slice(0, n), W / 2 - full / 2, H / 2, "600 italic 130px Fraunces", INK, 1, "left");
  if (Math.floor(t * 4) % 2 === 0 || n < line.length) {
    x.font = "600 italic 130px Fraunces"; const w = x.measureText(line.slice(0, n)).width;
    x.fillStyle = GREEN; x.fillRect(W / 2 - full / 2 + w + 12, H / 2 - 60, 8, 120);
  }
  const r = seg(t, 4.35, DROP);
  for (let i = 0; i < 40 && r > 0; i++) {
    const a = hash(i) * 6.283, d = (1 - outC(r)) * (900 + hash(i + 7) * 700) + 40, len = 120 + 260 * r;
    x.strokeStyle = rgba(GREEN, 0.15 + 0.5 * r); x.lineWidth = 4;
    x.beginPath(); x.moveTo(W / 2 + Math.cos(a) * d, H / 2 + Math.sin(a) * d); x.lineTo(W / 2 + Math.cos(a) * (d + len), H / 2 + Math.sin(a) * (d + len)); x.stroke();
  }
}

// ----------------------------------------------- 5.0 – 5.93 s: the drop
function reveal(t) {
  if (t < DROP || t > DROP + 2 * BEAT) return;
  grove(t, 1);
  for (let i = 0; i < 3; i++) {
    const q = seg(t, DROP + i * 0.06, DROP + 0.7 + i * 0.06);
    if (q > 0 && q < 1) { x.beginPath(); x.arc(W / 2, 400, 90 + outC(q) * 900, 0, 7); x.strokeStyle = rgba(GREEN, 0.45 * (1 - q)); x.lineWidth = 10 * (1 - q) + 2; x.stroke(); }
  }
  const burst = seg(t, DROP, DROP + 0.9);
  for (let i = 0; i < 70; i++) {
    const a = hash(i * 1.7) * 6.283, d = outC(burst) * (300 + hash(i) * 800), s = 9 + hash(i + 2) * 14;
    x.save(); x.translate(W / 2 + Math.cos(a) * d, 400 + Math.sin(a) * d); x.rotate(a + t * 4);
    x.fillStyle = rgba(i % 3 ? "#4E8C66" : "#8DBF9C", 1 - burst); x.fillRect(-s / 2, -s / 4, s, s / 2); x.restore();
  }
  const p = back(seg(t, DROP, DROP + 0.35)), w = outQ(seg(t, DROP + 0.12, DROP + 0.45));
  glass(W / 2 - 430, 200, 860, 640, 40, clamp(p));
  logo(W / 2, 380, 230 * p, clamp(p * 2), (1 - clamp(p)) * 1.5);
  txt("Glade", W / 2, 640 + (1 - w) * 70, "600 italic 220px Fraunces", INK, w);
}

// --------------------------------------- 5.93 – 10.58 s: one feature a beat
const MONTAGE = [
  ["Every version", "1.8.9 → 26.3", "title"], ["Zoom & Freelook", "on keys you choose", "freelook-cape-sky"],
  ["Your HUD", "sharp, rounded or smooth", "hud-style"], ["Any colour", "wheel, hex or chroma", "color-picker"],
  ["Crash fixer", "names the mod to blame", "launcher-crash"], ["Auto updates", "always the newest Glade", "launcher-update"],
  ["Tiers", "show what you're worth", null], ["Server hosting", "one click, no setup", null],
  ["Host on your PC", "play with friends, free", null], ["FPS boost", "zero bloat", null],
];
function art(i, lt, cx, cy) {
  // the cards for features without a screenshot
  if (i === 6) ["HT1", "LT2", "HT3"].forEach((s, k) => {
    const p = back(seg(lt, 0.04 + k * 0.05, 0.22 + k * 0.05)); x.save(); x.translate(cx + (k - 1) * 230, cy); x.scale(p, p);
    glass(-95, -95, 190, 190, 30, clamp(p)); txt(s, 0, 4, "800 64px Jakarta", [GREEN, "#C08A2E", "#6B5BD6"][k], clamp(p)); x.restore();
  });
  if (i === 7 || i === 8) {
    const p = outQ(seg(lt, 0.03, 0.2)); glass(cx - 330, cy - 150, 660, 300, 34, p);
    const rows = i === 7 ? ["glade-smp.net", "Online · 24 / 100"] : ["Your PC", "3 friends joined"];
    x.save(); x.globalAlpha *= p; x.beginPath(); x.arc(cx - 250, cy - 40, 16, 0, 7); x.fillStyle = "#38B26B"; x.fill(); x.restore();
    txt(rows[0], cx - 210, cy - 40, "800 50px Jakarta", INK, p, "left"); txt(rows[1], cx - 210, cy + 40, "500 34px Jakarta", MUTED, p, "left");
  }
  if (i === 9) {
    const n = Math.round(60 + outQ(seg(lt, 0.02, 0.4)) * 360);
    glass(cx - 330, cy - 150, 660, 300, 34, 1); txt(String(n), cx - 40, cy + 6, "800 170px Jakarta", GREEN, 1, "right"); txt("FPS", cx + 10, cy + 40, "800 60px Jakarta", MUTED, 1, "left");
  }
}
function montage(t) {
  const start = DROP + 2 * BEAT;
  if (t < start || t >= END) return;
  const i = Math.min(MONTAGE.length - 1, Math.floor((t - start) / BEAT)), lt = t - start - i * BEAT;
  const [big, small, shot] = MONTAGE[i], left = i % 2 === 0;
  grove(t, 1);
  const p = outQ(seg(lt, 0, 0.18)), dir = left ? 1 : -1;
  // caption on one side, the client on the other
  const tx = left ? 150 : W - 150, align = left ? "left" : "right";
  txt(String(i + 1).padStart(2, "0") + " / 10", tx - dir * (1 - p) * 120, 330, "800 30px Jakarta", GREEN, p, align, 6);
  txt(big, tx - dir * (1 - p) * 200, 440, "600 italic 120px Fraunces", INK, p, align);
  txt(small, tx - dir * (1 - p) * 260, 540, "500 46px Jakarta", MUTED, seg(lt, 0.05, 0.2), align);
  const cx = left ? W - 560 : 560, cy = H / 2 + 10;
  x.save(); x.translate(cx + dir * (1 - p) * 500, cy); x.rotate(dir * (1 - p) * 0.05 - dir * 0.012); x.scale(0.94 + lt * 0.08, 0.94 + lt * 0.08);
  if (shot) {
    const w = 900, h = 506; glass(-w / 2 - 14, -h / 2 - 14, w + 28, h + 28, 26, p);
    x.save(); x.globalAlpha *= p; rr(-w / 2, -h / 2, w, h, 16); x.clip(); x.drawImage(SHOTS[shot], -w / 2, -h / 2, w, h); x.restore();
  } else art(i, lt, 0, 0);
  x.restore();
  const wipe = seg(lt, 0, 0.1);
  if (wipe < 1) { x.fillStyle = rgba(left ? GREEN : MINT, 0.9); x.beginPath(); const e = wipe * (W + 600) - 300;
    x.moveTo(e, 0); x.lineTo(e + 220, 0); x.lineTo(e - 60, H); x.lineTo(e - 280, H); x.fill(); }
}

// ----------------------------------------------- 10.58 – 13 s: coming soon
function ending(t) {
  if (t < END) return;
  grove(t, 1);
  const p = back(seg(t, END, END + 0.35)), q = outQ(seg(t, END + 0.2, END + 0.55)), r = outC(seg(t, END + 0.45, END + 0.95));
  glass(W / 2 - 520, 170, 1040, 760, 44, clamp(p));
  for (let i = 0; i < 5; i++) {
    const s = seg(t, END + i * BEAT, END + i * BEAT + 0.9);
    if (s > 0 && s < 1) { x.beginPath(); x.arc(W / 2, 340, 100 + outC(s) * 380, 0, 7); x.strokeStyle = rgba(GREEN, 0.3 * (1 - s)); x.lineWidth = 4; x.stroke(); }
  }
  logo(W / 2, 340, 190 * p, clamp(p * 2));
  txt("Glade", W / 2, 560 + (1 - q) * 50, "600 italic 200px Fraunces", INK, q);
  const pw = 560, ph = 100;
  x.save(); x.globalAlpha *= r; x.shadowColor = rgba(GREEN, 0.4); x.shadowBlur = 40; x.shadowOffsetY = 14;
  rr(W / 2 - pw / 2, 705, pw, ph, 50); x.fillStyle = GREEN; x.fill(); x.restore();
  txt("COMING SOON", W / 2, 757, "800 52px Jakarta", PAPER, r, "center", 30 - r * 20);
  txt("The Minecraft client that stays out of your way.", W / 2, 870, "500 34px Jakarta", MUTED, outC(seg(t, END + 0.9, END + 1.4)));
}

function draw(t) {
  const since = t >= DROP ? (t - DROP) % BEAT : 99, bump = Math.exp(-since * 9);
  x.save();
  if (t >= DROP) { const z = 1 + bump * 0.02; x.translate(W / 2, H / 2); x.scale(z, z); x.translate(-W / 2, -H / 2); }
  if (t >= DROP && t < DROP + 0.4) { const s = (1 - seg(t, DROP, DROP + 0.4)) * 22; x.translate((hash(t * 97) - 0.5) * s, (hash(t * 61) - 0.5) * s); }
  problem(t); builtOwn(t); reveal(t); montage(t); ending(t);
  x.restore();
  for (const [ft, len, a] of [[DROP, 0.35, 1], [END, 0.3, 0.7]]) {
    const f = t >= ft ? 1 - seg(t, ft, ft + len) : 0;
    if (f > 0) { x.fillStyle = `rgba(255,255,255,${f * a})`; x.fillRect(0, 0, W, H); }
  }
  const fade = 1 - seg(t, 0, 0.15) + seg(t, 12.45, 12.95);
  if (fade > 0) { x.fillStyle = rgba(PAPER, clamp(fade)); x.fillRect(0, 0, W, H); }
}
window.ready = ready; window.draw = draw;
</script></body></html>
