[package]
name = "tuff-client"
version = "1.6.0"
description = "Glade - a fast, minimal Minecraft launcher"
authors = ["Glade"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "tuff_client_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls-native-roots", "http2", "charset"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
x11rb = "0.13"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
urlencoding = "2"
hickory-resolver = { version = "0.24", features = ["tokio-runtime", "system-config"] }
discord-rich-presence = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
