name: Glade

on:
  push:
    branches: [ "master", "claude/**" ]
    paths: [ "tuff-client/**", ".github/workflows/tuff-client.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "tuff-client/**", ".github/workflows/tuff-client.yml" ]
  workflow_dispatch:

concurrency:
  group: tuff-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Fabric mod
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tuff-client/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log || { echo "=== COMPILE ERRORS"; grep -E "error:" -A3 build.log | head -120; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: tuff-mod
          path: tuff-client/mod/build/libs/tuff-client-*.jar
          if-no-files-found: warn

  mod-test:
    name: Fabric mod in-game test
    needs: mod
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tuff-client/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software rendering drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb imagemagick
      - name: Run client game test
        # Same setup as Fabric API's own client tests: Mesa's software Vulkan driver.
        run: |
          timeout 15m xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" ./gradlew runClientGameTest --stacktrace
      - name: Print screenshot previews
        if: always()
        run: |
          for f in $(find . -path '*screenshots*' -name '*.png' | sort); do
            echo "Screenshot $(basename "$f"): $(identify -format '%wx%h' "$f")"
            convert "$f" -resize 960x -quality 70 /tmp/preview.jpg || continue
            echo "SHOT $(basename "$f") $(base64 -w0 /tmp/preview.jpg)"
          done
          for f in $(find . -path '*screenshots*' -name '*glade-account*.png' | sort); do
            convert "$f" -gravity northwest -crop 960x700+0+0 +repage -quality 92 /tmp/crop.jpg || continue
            echo "SHOT crop-$(basename "$f") $(base64 -w0 /tmp/crop.jpg)"
          done
          # Full-resolution crops show real text quality.
          for f in $(find . -path '*screenshots*' -name '*tuff-menu-mods*.png' -o -path '*screenshots*' -name '*tuff-title*.png' | sort); do
            convert "$f" -gravity center -crop 640x360+0+0 +repage -quality 92 /tmp/crop.jpg || continue
            echo "SHOT crop-$(basename "$f") $(base64 -w0 /tmp/crop.jpg)"
          done
      - name: Show game log
        if: failure()
        run: find . -name latest.log -path '*logs*' -exec tail -n 150 {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuff-mod-screenshots
          path: |
            tuff-client/mod/build/run/**/screenshots
            tuff-client/mod/run/**/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tuff-mod-test-logs
          path: |
            tuff-client/mod/build/run/**/logs
            tuff-client/mod/run/**/logs
            tuff-client/mod/build/run/**/crash-reports
            tuff-client/mod/run/**/crash-reports
          if-no-files-found: ignore

  loaders:
    name: Launcher loaders (install and start)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tuff-client/launcher/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 x11-xserver-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuff-client/launcher/src-tauri
      - name: Install Quilt, Forge and NeoForge profiles and start the game
        env:
          GLADE_SKIP_ASSETS: "1"
          GLADE_SMOKE: "quilt:1.21.1,neoforge:1.21.1,forge:1.20.1,forge:1.12.2"
        run: timeout 40m xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" cargo test --locked smoke -- --ignored --nocapture

  launcher:
    name: Launcher (.deb)
    needs: mod
    if: always()
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tuff-client/launcher
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Glade mod build
        uses: actions/download-artifact@v4
        with:
          name: tuff-mod
          path: tuff-client/launcher/mod-build
      - name: Bundle the mod
        run: |
          JAR=$(ls mod-build/tuff-client-*.jar 2>/dev/null | grep -vE 'sources|dev' | head -1 || true)
          # a launcher without the Glade mod would start the game without Glade
          if [ -z "$JAR" ]; then echo "::error::The Glade mod jar is missing"; exit 1; fi
          cp "$JAR" src-tauri/resources/tuff-mod.jar; echo "bundled $JAR"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tuff-client/launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuff-client/launcher/src-tauri
      - run: npm ci
      - run: npm run check
      - name: Rust tests
        working-directory: tuff-client/launcher/src-tauri
        run: cargo test --locked
      - name: Build .deb
        env:
          TUFF_MS_CLIENT_ID: ${{ secrets.TUFF_MS_CLIENT_ID }}
          TUFF_DISCORD_APP_ID: ${{ secrets.TUFF_DISCORD_APP_ID }}
          GLADE_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: npx tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: glade-deb
          path: tuff-client/launcher/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # Publishes an update when the version in tauri.conf.json is new: every
  # launcher checks the latest release's latest.json and updates itself and the
  # Glade mod. Bump the version to ship an update.
  release:
    name: Publish update
    needs: [launcher, mod-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/serene-euler-8ygwvm')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: glade-deb
          path: dist/deb
      - uses: actions/download-artifact@v4
        with:
          name: tuff-mod
          path: dist/mod
      - name: Publish the release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(jq -r .version tuff-client/launcher/src-tauri/tauri.conf.json)
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V is already released; bump the version to publish an update"; exit 0; fi
          mkdir -p out
          cp "$(ls dist/deb/*.deb | head -1)" "out/glade_${V}_amd64.deb"
          cp "$(ls dist/mod/tuff-client-*.jar | grep -vE 'sources|dev' | head -1)" out/glade-mod.jar
          MOD_V=$(unzip -p out/glade-mod.jar fabric.mod.json | jq -r .version)
          MC=$(unzip -p out/glade-mod.jar fabric.mod.json | jq -r .depends.minecraft)
          [ "$MOD_V" = "$V" ] || { echo "::error::mod version $MOD_V doesn't match $V"; exit 1; }
          BASE="https://github.com/${{ github.repository }}/releases/download/v$V"
          jq -n --arg v "$V" --arg mc "$MC" --arg page "https://github.com/${{ github.repository }}/releases/tag/v$V" \
            --rawfile notes tuff-client/launcher/RELEASE_NOTES.md \
            --arg deb "$BASE/glade_${V}_amd64.deb" --arg debsha "$(sha256sum "out/glade_${V}_amd64.deb" | cut -d' ' -f1)" --argjson debsize "$(stat -c%s "out/glade_${V}_amd64.deb")" \
            --arg jar "$BASE/glade-mod.jar" --arg jarsha "$(sha256sum out/glade-mod.jar | cut -d' ' -f1)" --argjson jarsize "$(stat -c%s out/glade-mod.jar)" \
            '{version: $v, notes: ($notes | rtrimstr("\n")), page: $page,
              deb: {url: $deb, sha256: $debsha, size: $debsize},
              mod: {version: $v, minecraft: $mc, url: $jar, sha256: $jarsha, size: $jarsize}}' > out/latest.json
          cat out/latest.json
          gh release create "v$V" out/* --title "Glade $V" --notes-file tuff-client/launcher/RELEASE_NOTES.md --target "$GITHUB_SHA" --latest
