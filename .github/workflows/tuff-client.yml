name: Glade

on:
  push:
    branches: [ "master", "claude/**" ]
    paths: [ "tuff-client/**", ".github/workflows/tuff-client.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "tuff-client/**", ".github/workflows/tuff-client.yml" ]
  workflow_dispatch:

concurrency:
  group: tuff-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Fabric mod
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tuff-client/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log || { echo "=== COMPILE ERRORS"; grep -E "error:" -A3 build.log | head -120; exit 1; }
      - name: Print Minecraft APIs used by Glade
        if: always()
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then JAR="$j"; break; fi
          done
          echo "API-CLASSES $(unzip -l "$JAR" | grep -oE 'net/minecraft/client/[A-Za-z0-9/]*(Outline|NameTag|Nametag|Fog|Sky|Debug|Screenshot|ChatComponent|GuiMessage|Disconnected|ConnectScreen|ParticleEngine|OverlayTexture|LightTexture|Camera|MouseHandler|SubmitNodeCollector|EntityRenderer|LivingEntityRenderer|AvatarRenderer|PlayerRenderer|RenderTarget|PostChain|DeathScreen)[A-Za-z0-9$]*\.class' | sort -u | tr '\n' ' ')"
          dump() { echo "=== $1"; javap -p -cp "$JAR" "$1" 2>&1 | grep -vE 'lambda\$|Compiled from|access\$' | head -${2:-90}; }
          for c in net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.gui.components.ChatComponent net.minecraft.client.GuiMessage \
            net.minecraft.client.Camera net.minecraft.client.MouseHandler net.minecraft.world.entity.Entity net.minecraft.client.renderer.LevelRenderer \
            net.minecraft.client.renderer.entity.EntityRenderer net.minecraft.client.renderer.entity.LivingEntityRenderer net.minecraft.client.renderer.texture.OverlayTexture \
            net.minecraft.client.multiplayer.ClientLevel net.minecraft.world.level.Level net.minecraft.client.particle.ParticleEngine \
            net.minecraft.client.gui.components.DebugScreenOverlay net.minecraft.client.gui.components.debug.DebugScreenEntryList net.minecraft.client.Screenshot \
            net.minecraft.client.gui.screens.ConnectScreen net.minecraft.client.gui.screens.DisconnectedScreen net.minecraft.client.multiplayer.ServerData \
            net.minecraft.client.multiplayer.MultiPlayerGameMode net.minecraft.world.entity.player.Inventory net.minecraft.client.renderer.GameRenderer \
            net.minecraft.client.renderer.entity.state.EntityRenderState net.minecraft.client.renderer.SubmitNodeCollector net.minecraft.client.Options \
            net.minecraft.client.renderer.fog.FogRenderer net.minecraft.client.renderer.SkyRenderer net.minecraft.client.player.AbstractClientPlayer \
            net.minecraft.world.entity.player.PlayerSkin net.minecraft.core.ClientAsset\$Texture net.minecraft.client.multiplayer.ClientPacketListener \
            net.minecraft.network.chat.ClickEvent net.minecraft.client.gui.Gui net.minecraft.client.gui.screens.DeathScreen net.minecraft.client.renderer.texture.DynamicTexture \
            com.mojang.blaze3d.platform.NativeImage net.minecraft.client.renderer.texture.TextureManager net.minecraft.client.KeyboardHandler \
            net.minecraft.client.renderer.feature.NameTagFeatureRenderer net.minecraft.client.renderer.state.LevelRenderState net.minecraft.client.renderer.state.SkyRenderState \
            net.minecraft.client.renderer.state.CameraRenderState net.minecraft.client.multiplayer.resolver.ServerAddress net.minecraft.client.gui.screens.TitleScreen; do
            dump "$c" 140
          done
          echo "=== OverlayTexture bytecode"; javap -c -p -cp "$JAR" net.minecraft.client.renderer.texture.OverlayTexture 2>&1 | head -80
          echo "=== LevelRenderer outline bytecode"; javap -c -p -cp "$JAR" net.minecraft.client.renderer.LevelRenderer 2>&1 | grep -iE "outline|Outline|ARGB|ldc|sipush|bipush" | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: tuff-mod
          path: tuff-client/mod/build/libs/tuff-client-*.jar
          if-no-files-found: warn

  mod-test:
    name: Fabric mod in-game test
    needs: mod
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tuff-client/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software rendering drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb imagemagick
      - name: Run client game test
        # Same setup as Fabric API's own client tests: Mesa's software Vulkan driver.
        run: |
          timeout 15m xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" ./gradlew runClientGameTest --stacktrace
      - name: Print screenshot previews
        if: always()
        run: |
          for f in $(find . -path '*screenshots*' -name '*.png' | sort); do
            echo "Screenshot $(basename "$f"): $(identify -format '%wx%h' "$f")"
            convert "$f" -resize 960x -quality 70 /tmp/preview.jpg || continue
            echo "SHOT $(basename "$f") $(base64 -w0 /tmp/preview.jpg)"
          done
          for f in $(find . -path '*screenshots*' -name '*glade-account*.png' | sort); do
            convert "$f" -gravity northwest -crop 960x700+0+0 +repage -quality 92 /tmp/crop.jpg || continue
            echo "SHOT crop-$(basename "$f") $(base64 -w0 /tmp/crop.jpg)"
          done
          # Full-resolution crops show real text quality.
          for f in $(find . -path '*screenshots*' -name '*tuff-menu-mods*.png' -o -path '*screenshots*' -name '*tuff-title*.png' | sort); do
            convert "$f" -gravity center -crop 640x360+0+0 +repage -quality 92 /tmp/crop.jpg || continue
            echo "SHOT crop-$(basename "$f") $(base64 -w0 /tmp/crop.jpg)"
          done
      - name: Show game log
        if: failure()
        run: find . -name latest.log -path '*logs*' -exec tail -n 150 {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuff-mod-screenshots
          path: |
            tuff-client/mod/build/run/**/screenshots
            tuff-client/mod/run/**/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tuff-mod-test-logs
          path: |
            tuff-client/mod/build/run/**/logs
            tuff-client/mod/run/**/logs
            tuff-client/mod/build/run/**/crash-reports
            tuff-client/mod/run/**/crash-reports
          if-no-files-found: ignore

  loaders:
    name: Launcher loaders (install and start)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tuff-client/launcher/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 x11-xserver-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuff-client/launcher/src-tauri
      - name: Install Quilt, Forge and NeoForge profiles and start the game
        env:
          GLADE_SKIP_ASSETS: "1"
          GLADE_SMOKE: "quilt:1.21.1,neoforge:1.21.1,forge:1.20.1,forge:1.12.2"
        run: timeout 40m xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" cargo test --locked smoke -- --ignored --nocapture

  launcher:
    name: Launcher (.deb)
    needs: mod
    if: always()
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tuff-client/launcher
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Tuff mod build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tuff-mod
          path: tuff-client/launcher/mod-build
      - name: Bundle the mod
        run: |
          JAR=$(ls mod-build/tuff-client-*.jar 2>/dev/null | grep -vE 'sources|dev' | head -1 || true)
          if [ -n "$JAR" ]; then cp "$JAR" src-tauri/resources/tuff-mod.jar; echo "bundled $JAR"; else echo "::warning::Tuff mod jar not available; building the launcher without it"; fi
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tuff-client/launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuff-client/launcher/src-tauri
      - run: npm ci
      - run: npm run check
      - name: Rust tests
        working-directory: tuff-client/launcher/src-tauri
        run: cargo test --locked
      - name: Build .deb
        env:
          TUFF_MS_CLIENT_ID: ${{ secrets.TUFF_MS_CLIENT_ID }}
          TUFF_DISCORD_APP_ID: ${{ secrets.TUFF_DISCORD_APP_ID }}
        run: npx tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: glade-deb
          path: tuff-client/launcher/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
