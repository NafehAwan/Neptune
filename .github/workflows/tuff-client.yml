name: Tuff Client

on:
  push:
    branches: [ "master", "claude/**" ]
    paths: [ "tuff-client/**", ".github/workflows/tuff-client.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "tuff-client/**", ".github/workflows/tuff-client.yml" ]
  workflow_dispatch:

concurrency:
  group: tuff-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Fabric mod
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tuff-client/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Dump vanilla API (temporary diagnostics)
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then JAR="$j"; break; fi
          done
          echo "=== font/pack/face/realms classes"
          unzip -l "$JAR" | grep -oE "[a-z/]*(FontDescription|Style|PackRepository|PackSelectionScreen|PlayerFaceRenderer|PlayerFaceExtractor|ControlsScreen|KeyBindsScreen|RealmsMainScreen|RenderPipelines|/User|Util)\.class" | sort -u
          dump() { echo "=== $1"; javap -cp "$JAR" "$1" 2>&1 | grep -vE "hashCode|equals|toString|Compiled from" | head -${2:-80}; }
          dump net.minecraft.network.chat.Style 90
          dump net.minecraft.network.chat.FontDescription
          dump 'net.minecraft.network.chat.FontDescription$Resource'
          dump net.minecraft.network.chat.MutableComponent 40
          dump net.minecraft.server.packs.repository.PackRepository
          dump net.minecraft.server.packs.repository.Pack 50
          dump net.minecraft.client.gui.components.PlayerFaceRenderer
          dump net.minecraft.client.gui.components.PlayerFaceExtractor
          dump net.minecraft.client.User 30
          dump net.minecraft.client.gui.screens.packs.PackSelectionScreen 20
          dump net.minecraft.client.gui.screens.options.controls.ControlsScreen 15
          dump net.minecraft.client.gui.screens.options.controls.KeyBindsScreen 15
          dump com.mojang.realmsclient.RealmsMainScreen 15
          dump net.minecraft.client.renderer.RenderPipelines 120
          dump com.mojang.blaze3d.platform.Window 90
          dump net.minecraft.util.Util 120
          echo "=== Minecraft (filtered)"
          javap -cp "$JAR" net.minecraft.client.Minecraft | grep -iE "pack|reload|user|texture|skin|window|profile|realms|stop" | head -40
          echo "=== Options (filtered)"
          javap -cp "$JAR" net.minecraft.client.Options | grep -iE "resourcePacks|incompatible|save\(|load" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: tuff-mod
          path: tuff-client/mod/build/libs/tuff-client-*.jar
          if-no-files-found: warn

  mod-test:
    name: Fabric mod in-game test
    needs: mod
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tuff-client/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software rendering drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb imagemagick
      - name: Run client game test
        # Same setup as Fabric API's own client tests: Mesa's software Vulkan driver.
        run: |
          timeout 15m xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClientGameTest --stacktrace
      - name: Print screenshot previews
        if: always()
        run: |
          for f in $(find . -path '*screenshots*' -name '*.png' | sort); do
            convert "$f" -resize 960x -quality 70 /tmp/preview.jpg || continue
            echo "SHOT $(basename "$f") $(base64 -w0 /tmp/preview.jpg)"
          done
      - name: Show game log
        if: failure()
        run: find . -name latest.log -path '*logs*' -exec tail -n 150 {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuff-mod-screenshots
          path: |
            tuff-client/mod/build/run/**/screenshots
            tuff-client/mod/run/**/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tuff-mod-test-logs
          path: |
            tuff-client/mod/build/run/**/logs
            tuff-client/mod/run/**/logs
            tuff-client/mod/build/run/**/crash-reports
            tuff-client/mod/run/**/crash-reports
          if-no-files-found: ignore

  launcher:
    name: Launcher (.deb)
    needs: mod
    if: always()
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tuff-client/launcher
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Tuff mod build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tuff-mod
          path: tuff-client/launcher/mod-build
      - name: Bundle the mod
        run: |
          JAR=$(ls mod-build/tuff-client-*.jar 2>/dev/null | grep -vE 'sources|dev' | head -1 || true)
          if [ -n "$JAR" ]; then cp "$JAR" src-tauri/resources/tuff-mod.jar; echo "bundled $JAR"; else echo "::warning::Tuff mod jar not available; building the launcher without it"; fi
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tuff-client/launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuff-client/launcher/src-tauri
      - run: npm ci
      - run: npm run check
      - name: Rust tests
        working-directory: tuff-client/launcher/src-tauri
        run: cargo test --locked
      - name: Build .deb
        env:
          TUFF_MS_CLIENT_ID: ${{ secrets.TUFF_MS_CLIENT_ID }}
          TUFF_DISCORD_APP_ID: ${{ secrets.TUFF_DISCORD_APP_ID }}
        run: npx tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: tuff-client-deb
          path: tuff-client/launcher/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
