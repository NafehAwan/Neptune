name: Glade

on:
  push:
    branches: [ "master", "claude/**" ]
    paths: [ "tuff-client/**", ".github/workflows/tuff-client.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "tuff-client/**", ".github/workflows/tuff-client.yml" ]
  workflow_dispatch:

concurrency:
  group: tuff-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Fabric mod
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tuff-client/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every Minecraft version
        env:
          # Versions that must build; the others are still being ported.
          READY: "1.21.1 1.21.3 1.21.4 1.21.5 1.21.8 1.21.10 1.21.11 26.1 26.2 26.3"
        run: |
          ./gradlew buildAndCollect --continue 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          echo "=== BUILT"; ls build/libs || true
          if [ "$status" -ne 0 ]; then
            echo "=== COMPILE ERRORS"
            grep -E "error:|warning: \[|What went wrong|^> |Could not|Exception" -A3 build.log | head -400
          fi
          for v in $READY; do
            ls build/libs/tuff-client-*+$v.jar >/dev/null 2>&1 || { echo "::error::Glade for Minecraft $v didn't build"; failed=1; }
          done
          exit ${failed:-0}
      - name: Dump the Minecraft APIs Glade uses, per version
        if: always()
        run: |
          ./gradlew gladeClasspath --continue -q || true
          python3 tools/apidump.py $(grep -oE 'versions\(([^)]*)\)' settings.gradle.kts | grep -oE '[0-9][0-9.]*')
      - uses: actions/upload-artifact@v4
        with:
          name: tuff-mod
          path: tuff-client/mod/build/libs/tuff-client-*.jar
          if-no-files-found: warn

  mod-legacy:
    name: Fabric mod (1.8.9)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tuff-client/mod-legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          ./gradlew build 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then echo "=== COMPILE ERRORS"; grep -E "error:|What went wrong|^> |Could not" -A3 build.log | head -200; exit 1; fi
          ls build/libs
      - name: Dump the 1.8.9 APIs Glade uses
        if: always()
        run: python3 tools/dump.py
      - uses: actions/upload-artifact@v4
        with:
          name: tuff-mod-legacy
          path: tuff-client/mod-legacy/build/libs/tuff-client-*.jar
          if-no-files-found: warn

  mod-test:
    name: Fabric mod in-game test
    needs: mod
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tuff-client/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software rendering drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb imagemagick
      - name: Run client game test
        # Same setup as Fabric API's own client tests: Mesa's software Vulkan driver.
        run: |
          timeout 15m xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" ./gradlew :26.3:runClientGameTest --stacktrace
      - name: Print screenshot previews
        if: always()
        run: |
          for f in $(find . -path '*screenshots*' -name '*.png' | sort); do
            echo "Screenshot $(basename "$f"): $(identify -format '%wx%h' "$f")"
            convert "$f" -resize 960x -quality 70 /tmp/preview.jpg || continue
            echo "SHOT $(basename "$f") $(base64 -w0 /tmp/preview.jpg)"
          done
          for f in $(find . -path '*screenshots*' -name '*glade-account*.png' | sort); do
            convert "$f" -gravity northwest -crop 960x700+0+0 +repage -quality 92 /tmp/crop.jpg || continue
            echo "SHOT crop-$(basename "$f") $(base64 -w0 /tmp/crop.jpg)"
          done
          # Full-resolution crops show real text quality.
          for f in $(find . -path '*screenshots*' -name '*tuff-menu-mods*.png' -o -path '*screenshots*' -name '*tuff-title*.png' | sort); do
            convert "$f" -gravity center -crop 640x360+0+0 +repage -quality 92 /tmp/crop.jpg || continue
            echo "SHOT crop-$(basename "$f") $(base64 -w0 /tmp/crop.jpg)"
          done
      - name: Show game log
        if: failure()
        run: find . -name latest.log -path '*logs*' -exec tail -n 150 {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glade-test-screenshots
          path: |
            tuff-client/mod/**/run/**/screenshots
            tuff-client/mod/run/**/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: glade-test-logs
          path: |
            tuff-client/mod/**/run/**/logs
            tuff-client/mod/run/**/logs
            tuff-client/mod/**/run/**/crash-reports
            tuff-client/mod/run/**/crash-reports
          if-no-files-found: ignore

  loaders:
    name: Launcher loaders (install and start)
    needs: [mod, mod-legacy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: tuff-client/launcher/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 x11-xserver-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuff-client/launcher/src-tauri
      - name: Fetch the Glade mod builds
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: tuff-mod*
          path: tuff-client/launcher/src-tauri/glade-jars
          merge-multiple: true
      - name: Install every loader, put Glade in each Fabric profile and start the game
        env:
          GLADE_SKIP_ASSETS: "1"
          GLADE_JARS: glade-jars
          GLADE_SMOKE: "fabric:1.8.9,fabric:1.8.8,fabric:1.21.1,fabric:1.21.3,fabric:1.21.4,fabric:1.21.5,fabric:1.21.8,fabric:1.21.10,fabric:1.21.11,fabric:26.1,fabric:26.2,fabric:26.3,quilt:1.21.1,neoforge:1.21.1,forge:1.20.1,forge:1.12.2"
        run: timeout 70m xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" cargo test --locked smoke -- --ignored --nocapture

  launcher:
    name: Launcher (.deb)
    needs: [mod, mod-legacy]
    if: always()
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tuff-client/launcher
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Glade mod builds
        uses: actions/download-artifact@v4
        with:
          pattern: tuff-mod*
          path: tuff-client/launcher/mod-build
          merge-multiple: true
      - name: Bundle the mod
        run: |
          # a launcher without the Glade mod would start the game without Glade
          if ! ls mod-build/tuff-client-*+26.3.jar >/dev/null 2>&1; then echo "::error::The Glade mod jar is missing"; exit 1; fi
          mkdir -p src-tauri/resources/glade-mods
          cp mod-build/tuff-client-*.jar src-tauri/resources/glade-mods/
          ls -l src-tauri/resources/glade-mods
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tuff-client/launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuff-client/launcher/src-tauri
      - run: npm ci
      - run: npm run check
      - name: Rust tests
        working-directory: tuff-client/launcher/src-tauri
        run: cargo test --locked
      - name: Build .deb
        env:
          TUFF_MS_CLIENT_ID: ${{ secrets.TUFF_MS_CLIENT_ID }}
          TUFF_DISCORD_APP_ID: ${{ secrets.TUFF_DISCORD_APP_ID }}
          GLADE_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: npx tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: glade-deb
          path: tuff-client/launcher/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # Publishes an update when the version in tauri.conf.json is new: every
  # launcher checks the latest release's latest.json and updates itself and the
  # Glade mod. Bump the version to ship an update.
  release:
    name: Publish update
    needs: [launcher, mod-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/serene-euler-8ygwvm')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: glade-deb
          path: dist/deb
      - uses: actions/download-artifact@v4
        with:
          pattern: tuff-mod*
          path: dist/mod
          merge-multiple: true
      - name: Publish the release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(jq -r .version tuff-client/launcher/src-tauri/tauri.conf.json)
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V is already released; bump the version to publish an update"; exit 0; fi
          mkdir -p out
          cp "$(ls dist/deb/*.deb | head -1)" "out/glade_${V}_amd64.deb"
          # every Glade build, one per group of Minecraft versions
          MODS='[]'
          for j in dist/mod/tuff-client-*.jar; do
            mc=${j##*+}; mc=${mc%.jar}; name="glade-$mc.jar"
            cp "$j" "out/$name"
            range=$(unzip -p "$j" fabric.mod.json | jq -r .depends.minecraft)
            MODS=$(jq --arg v "$V" --arg mc "$range" --arg f "$name" --arg url "https://github.com/${{ github.repository }}/releases/download/v$V/$name" \
              --arg sha "$(sha256sum "out/$name" | cut -d' ' -f1)" --argjson size "$(stat -c%s "out/$name")" \
              '. + [{version: $v, minecraft: $mc, file: $f, url: $url, sha256: $sha, size: $size}]' <<<"$MODS")
          done
          # launcher 1.1.0 reads only "mod" (the 26.3 build)
          cp "$(ls dist/mod/tuff-client-*+26.3.jar | head -1)" out/glade-mod.jar
          MOD_V=$(unzip -p out/glade-mod.jar fabric.mod.json | jq -r .version)
          MC=$(unzip -p out/glade-mod.jar fabric.mod.json | jq -r .depends.minecraft)
          [ "$MOD_V" = "$V" ] || { echo "::error::mod version $MOD_V doesn't match $V"; exit 1; }
          BASE="https://github.com/${{ github.repository }}/releases/download/v$V"
          jq -n --arg v "$V" --arg mc "$MC" --arg page "https://github.com/${{ github.repository }}/releases/tag/v$V" \
            --rawfile notes tuff-client/launcher/RELEASE_NOTES.md \
            --arg deb "$BASE/glade_${V}_amd64.deb" --arg debsha "$(sha256sum "out/glade_${V}_amd64.deb" | cut -d' ' -f1)" --argjson debsize "$(stat -c%s "out/glade_${V}_amd64.deb")" \
            --argjson mods "$MODS" \
            --arg jar "$BASE/glade-mod.jar" --arg jarsha "$(sha256sum out/glade-mod.jar | cut -d' ' -f1)" --argjson jarsize "$(stat -c%s out/glade-mod.jar)" \
            '{version: $v, notes: ($notes | rtrimstr("\n")), page: $page,
              deb: {url: $deb, sha256: $debsha, size: $debsize},
              mod: {version: $v, minecraft: $mc, url: $jar, sha256: $jarsha, size: $jarsize},
              mods: $mods}' > out/latest.json
          cat out/latest.json
          gh release create "v$V" out/* --title "Glade $V" --notes-file tuff-client/launcher/RELEASE_NOTES.md --target "$GITHUB_SHA" --latest
